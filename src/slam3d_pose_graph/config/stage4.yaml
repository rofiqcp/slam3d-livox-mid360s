# P4 CPU bounded GTSAM/TBB, loop overlap and PCL point budget.
pose_graph_node:
  ros__parameters:
    odom_topic: /lio/odometry
    cloud_topic: /lio/cloud_registered
    input_frame: lio_odom
    map_frame: map
    child_frame: livox_frame
    publish_tf: true
    enable_loop_closure: true
    keyframe_distance_m: 1.0
    keyframe_rotation_deg: 12.0
    sync_tolerance_s: 0.03
    min_loop_separation_s: 15.0
    min_loop_keyframes: 25
    min_keyframes_between_accepted_loops: 6
    candidate_radius_m: 8.0
    descriptor_max_distance: 0.29
    scan_context_max_radius_m: 50.0
    icp_max_correspondence_m: 2.0
    icp_max_iterations: 45
    icp_fitness_threshold: 0.15
    max_loop_correction_m: 2.0
    max_loop_rotation_deg: 35.0
    scan_voxel_m: 0.5
    map_voxel_m: 0.3
    map_publish_period_s: 5.0
    max_keyframes: 1500
    max_map_points: 250000
    map_output_dir: ''
    loop_min_overlap_ratio: 0.3
    loop_overlap_distance_m: 0.65
    loop_overlap_max_samples: 1000
    tbb_max_parallelism: 4
